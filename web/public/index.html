<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101c2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LifeOS">
  <title>LifeOS</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/money.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="topbar"><a href="#today" class="brand"><img src="/icon.svg" alt="" width="36" height="36">LifeOS</a><button id="refresh" class="quiet" aria-label="Refresh current page">Refresh</button></header>
  <main id="main" tabindex="-1"><p class="loading" role="status">Opening your day…</p></main>
  <nav class="nav" aria-label="Main navigation">
    <a href="#today" data-page="today"><span aria-hidden="true">◉</span>Today</a>
    <a href="#money" data-page="money"><span aria-hidden="true">₹</span>Money</a>
    <a href="#priority" data-page="priority"><span aria-hidden="true">◇</span>Priority</a>
    <a href="#ask" data-page="ask"><span aria-hidden="true">✦</span>Ask</a>
    <a href="#more" data-page="more"><span aria-hidden="true">•••</span>More</a>
  </nav>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="detail"><div class="dialog-top"><h2 id="detail-title">Details</h2><button id="close-detail" class="quiet">Close</button></div><div id="detail-body"></div></dialog>
</body>
</html>
