services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifeos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifeos}
      POSTGRES_DB: ${POSTGRES_DB:-lifeos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifeos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Local-day binning (expense date windows, daily scores) uses the
      # container's wall-clock day, so it must run in India time — otherwise a
      # UTC container treats an IST-evening transaction (dated "tomorrow" in IST)
      # as a future date and the /expenses window hides it for ~5.5h each night.
      # Audit columns store UTC explicitly via utcnow(), so this is binning-only.
      TZ: ${TZ:-Asia/Kolkata}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-lifeos}:${POSTGRES_PASSWORD:-lifeos}@db:5432/${POSTGRES_DB:-lifeos}
      OPENCLAW_BASE_URL: ${OPENCLAW_BASE_URL:-http://host.docker.internal:11434}
      OPENCLAW_MODEL: ${OPENCLAW_MODEL:-qwen3.5:4b}
      OPENCLAW_TIMEOUT_SECONDS: ${OPENCLAW_TIMEOUT_SECONDS:-90}
      OPENCLAW_CHAT_DEADLINE_SECONDS: ${OPENCLAW_CHAT_DEADLINE_SECONDS:-135}
      OPENCLAW_MAX_TOKENS: ${OPENCLAW_MAX_TOKENS:-384}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPOS: ${GITHUB_REPOS:-}
      GITHUB_USER: ${GITHUB_USER:-}
      HAE_HOST: ${HAE_HOST:-}
      HAE_PORT: ${HAE_PORT:-9000}
      # Expense collector — read-only Gmail via the baked-in gog binary. Auth is
      # the mounted gogcli config below; only the keyring password is a secret.
      GMAIL_ACCOUNT: ${GMAIL_ACCOUNT:-}
      GOG_KEYRING_PASSWORD: ${GOG_KEYRING_PASSWORD:-}
      EXPENSE_BACKFILL_DAYS: ${EXPENSE_BACKFILL_DAYS:-90}
      # CC statement PDF unlock (see services/pdf_unlock.py)
      CC_OWNER_NAME: ${CC_OWNER_NAME:-}
      CC_OWNER_DOB: ${CC_OWNER_DOB:-}
      CC_PDF_PASSWORD_OVERRIDES: ${CC_PDF_PASSWORD_OVERRIDES:-}
      # Owner name(s)/VPA handle(s) for self-transfer detection (reconcile.py).
      # Falls back to CC_OWNER_NAME when unset.
      EXPENSE_OWNER_IDENTITIES: ${EXPENSE_OWNER_IDENTITIES:-}
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # gog auth. Config (client + keyring_backend flag) is shared read-only.
      # The data dir (credentials + file keyring) needs write access for gog's
      # lock file, so it is a life_os-owned COPY — isolated from other gog
      # consumers on the host, but backed by the same authorized refresh token.
      - ${GOGCLI_CONFIG_DIR:-/home/ajmalrasi/.config/gogcli}:/root/.config/gogcli:ro
      - ${GOGCLI_DATA_DIR:-/home/ajmalrasi/lifeos-gog/data}:/root/.local/share/gogcli:rw

volumes:
  postgres_data:
